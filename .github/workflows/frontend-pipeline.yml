name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sahabat-umkm-fe/package-lock.json

      - name: Install Dependencies
        working-directory: sahabat-umkm-fe
        run: npm ci

      - name: Code Linting
        working-directory: sahabat-umkm-fe
        run: npm run lint || true

      - name: Build Verification
        working-directory: sahabat-umkm-fe
        env:
          VITE_API_BASE_URL: http://localhost:3000
        run: npm run build

  build-docker:
    name: Build Docker Container
    needs: build-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: sahabat-umkm-fe
          file: sahabat-umkm-fe/docker/Dockerfile
          push: false
          tags: sahabat-umkm-fe:latest

